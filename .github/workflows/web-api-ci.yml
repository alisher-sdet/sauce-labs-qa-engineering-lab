name: Web and API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-api:
    name: Web and API tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Check code formatting
        run: npm run format:check

      - name: Start local httpbin
        run: docker compose up -d

      - name: Wait for httpbin
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              "http://127.0.0.1:8080/get?source=ci" \
              > /dev/null; then
              echo "httpbin is ready"
              exit 0
            fi
            sleep 2
          done

          docker compose logs httpbin
          echo "httpbin did not become ready in time"
          exit 1

      - name: Run Web and API tests
        run: npm test

      - name: Stop local httpbin
        if: always()
        run: docker compose down
