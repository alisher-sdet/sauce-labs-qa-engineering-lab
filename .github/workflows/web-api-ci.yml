name: Web and API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-api:
    name: Web and API tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

      - name: Start local httpbin
        run: docker compose up -d

      - name: Wait for httpbin
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              "http://127.0.0.1:8080/get?source=ci" \
              > /dev/null; then
              echo "httpbin is ready"
              exit 0
            fi
            sleep 2
          done

          docker compose logs httpbin
          echo "httpbin did not become ready in time"
          exit 1

      - name: Run Web and API tests
        run: npm test

      - name: Stop local httpbin
        if: always()
        run: docker compose down

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: web-api/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload JUnit XML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: web-api/junit-results/results.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish test results summary
        if: always()
        run: |
          if [ ! -f junit-results/results.xml ]; then
            echo "## Web and API test results" >> "$GITHUB_STEP_SUMMARY"
            echo "JUnit XML report was not generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python - <<'PY'
          import xml.etree.ElementTree as ET
          import os

          root = ET.parse("junit-results/results.xml").getroot()

          def count_attr(name):
              return sum(
                  int(suite.attrib.get(name, 0))
                  for suite in root.iter("testsuite")
              )

          tests = int(root.attrib.get("tests", count_attr("tests")))
          failures = int(root.attrib.get("failures", count_attr("failures")))
          errors = int(root.attrib.get("errors", count_attr("errors")))
          skipped = int(root.attrib.get("skipped", count_attr("skipped")))

          passed = tests - failures - errors - skipped

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Web and API test results\n\n")
              summary.write("| Metric | Count |\n|---|---:|\n")
              summary.write(f"| Passed | {passed} |\n")
              summary.write(f"| Failed | {failures} |\n")
              summary.write(f"| Errors | {errors} |\n")
              summary.write(f"| Skipped | {skipped} |\n")
              summary.write(f"| Total | {tests} |\n")
          PY
