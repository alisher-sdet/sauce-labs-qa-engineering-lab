name: Mobile Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mobile-android:
    name: Android UI smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: mobile/uv.lock

      - name: Install Python
        run: uv python install 3.13.8

      - name: Ruff lint
        working-directory: mobile
        run: uv run --locked ruff check .

      - name: Install Appium and UiAutomator2
        run: |
          npm install --global appium@3.8.0
          appium driver install uiautomator2@6.9.3
      - name: Enable KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm
          sudo groupadd -f kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Download and verify My Demo App
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/saucelabs/my-demo-app-android/releases/download/2.3.0/mda-2.3.0-27.apk" \
            --output /tmp/mda-2.3.0-27.apk

          echo "bd3a3d6f2d50e076b2701ed2cc6a0ca82157b40a7033cf5be9f5d084b6591ec8  /tmp/mda-2.3.0-27.apk" \
            | sha256sum --check

      - name: Run Android UI smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true
          disable-linux-hw-accel: false
          script: bash mobile/scripts/ci-android-smoke.sh

      - name: Upload Mobile JUnit XML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-junit-test-results
          path: mobile/junit-results/results.xml
          if-no-files-found: ignore

      - name: Publish mobile test results summary
        if: always()
        run: |
          if [ ! -f mobile/junit-results/results.xml ]; then
            echo "## Mobile Android test results" >> "$GITHUB_STEP_SUMMARY"
            echo "JUnit XML report was not generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python3 - <<'PYTHON'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse("mobile/junit-results/results.xml").getroot()

          def count_attr(name):
              return sum(
                  int(suite.attrib.get(name, 0))
                  for suite in root.iter("testsuite")
              )

          tests = int(root.attrib.get("tests", count_attr("tests")))
          failures = int(root.attrib.get("failures", count_attr("failures")))
          errors = int(root.attrib.get("errors", count_attr("errors")))
          skipped = int(root.attrib.get("skipped", count_attr("skipped")))
          passed = tests - failures - errors - skipped

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Mobile Android test results\n\n")
              summary.write("| Metric | Count |\n|---|---:|\n")
              summary.write(f"| Passed | {passed} |\n")
              summary.write(f"| Failed | {failures} |\n")
              summary.write(f"| Errors | {errors} |\n")
              summary.write(f"| Skipped | {skipped} |\n")
              summary.write(f"| Total | {tests} |\n")
          PYTHON

      - name: Upload Appium logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: appium-logs
          path: /tmp/appium.log
          if-no-files-found: ignore
