[project]
name = "mobile"
version = "0.1.0"
requires-python = ">=3.13.8"
dependencies = [
    "appium-python-client>=6.0.7",
    "pytest>=9.1.1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "I",  # isort
]